backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "es"

collections:

  # ═══════════════ PROPIEDADES EN VENTA ═══════════════
  - name: "listings"
    label: "Propiedades en Venta"
    files:
      - file: "content/listings.json"
        label: "Listado de Propiedades"
        name: "listings"
        fields:
          - label: "Propiedades"
            name: "items"
            widget: "list"
            summary: "{{fields.address}} — {{fields.status}} — ${{fields.price}}"
            fields:
              - {label: "Dirección completa", name: "address", widget: "string"}
              - {label: "Ciudad", name: "city", widget: "string"}
              - {label: "Precio (solo número, ej. 564000)", name: "price", widget: "number", value_type: "int"}
              - label: "Estatus"
                name: "status"
                widget: "select"
                options:
                  - {label: "Activa", value: "Activa"}
                  - {label: "Bajo Contrato", value: "Bajo Contrato"}
                  - {label: "Vendida", value: "Vendida"}
                default: "Activa"
              - {label: "Habitaciones", name: "beds", widget: "number", value_type: "int"}
              - {label: "Baños", name: "baths", widget: "number", value_type: "float"}
              - {label: "Pies cuadrados (sqft)", name: "sqft", widget: "number", value_type: "int"}
              - {label: "Acres", name: "acres", widget: "string", required: false}
              - {label: "Año de construcción", name: "year", widget: "number", value_type: "int", required: false}
              - {label: "Número MLS", name: "mls", widget: "string", required: false}
              - label: "Etiquetas (Sin HOA, Piscina, etc.)"
                name: "tags"
                widget: "list"
                field: {label: "Etiqueta", name: "tag", widget: "string"}
                required: false
              - {label: "Descripción", name: "remarks", widget: "text"}
              - {label: "Foto principal", name: "hero_image", widget: "image"}
              - label: "Galería de fotos"
                name: "gallery"
                widget: "list"
                field: {label: "Foto", name: "img", widget: "image"}

  # ═══════════════ BLOG ═══════════════
  - name: "blog"
    label: "Blog"
    folder: "eleventy-src/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post.njk"}
      - {label: "Permalink", name: "permalink", widget: "hidden", default: "blog-{{ page.fileSlug }}.html"}
      - {label: "Título", name: "title", widget: "string"}
      - label: "Categoría"
        name: "category"
        widget: "select"
        options: ["FHA & Préstamos", "Guías Paso a Paso", "Zonas Locales", "Compradores Primerizos", "Vendedores", "Destacado"]
      - {label: "Resumen corto (aparece en la tarjeta)", name: "excerpt", widget: "text"}
      - {label: "Imagen de portada", name: "image", widget: "image", required: false}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Contenido completo del artículo", name: "body", widget: "markdown"}

  # ═══════════════ TESTIMONIOS / NUESTROS CLIENTES ═══════════════
  - name: "testimonials"
    label: "Nuestros Clientes"
    files:
      - file: "content/testimonials.json"
        label: "Historias de Clientes"
        name: "testimonials"
        fields:
          - label: "Historias"
            name: "stories"
            widget: "list"
            summary: "{{fields.name}} — {{fields.location}}"
            fields:
              - {label: "Nombre(s)", name: "name", widget: "string"}
              - {label: "Ubicación (Ciudad, FL)", name: "location", widget: "string"}
              - {label: "Foto", name: "photo", widget: "image"}
              - {label: "Historia", name: "story", widget: "text"}
              - {label: "Cita textual", name: "quote", widget: "string"}

  # ═══════════════ RESEÑAS ═══════════════
  - name: "reviews"
    label: "Reseñas"
    files:
      - file: "content/reviews.json"
        label: "Reseñas de Clientes"
        name: "reviews"
        fields:
          - {label: "Calificación (número, ej. 4.8)", name: "rating", widget: "string"}
          - {label: "Total de reseñas", name: "count", widget: "number", value_type: "int"}
          - label: "Reseñas individuales"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.stars}}★"
            fields:
              - {label: "Nombre", name: "name", widget: "string", default: "Cliente verificado"}
              - {label: "Estrellas (1-5)", name: "stars", widget: "number", value_type: "int", default: 5}
              - {label: "Texto de la reseña", name: "text", widget: "text"}
              - {label: "Fuente", name: "source", widget: "string", default: "Google"}
